# OSV-Scanner ignore list for requirements*.txt files in this directory.
#
# osv-scanner scans requirements.txt files that use bounded version ranges
# (e.g. >=3.29.4,<4.0) and checks the LOWEST satisfiable version for
# vulnerabilities, not the actual resolved version from the lockfiles.
# All ignores below are false positives — the actual pinned versions in the
# *.lock files are already above the fix versions.
#
# Verified against requirements-core.lock, requirements-ingestion.lock, and
# requirements-ci.lock (regenerated 2026-07-30 with uv pip compile --upgrade).

# --- False positives: osv-scanner not respecting version floors ---

# idna: osv-scanner checks 3.9.0; actual pinned version is 3.18 (fix: 3.15)
[[IgnoredVulns]]
id = "PYSEC-2026-215"
reason = "False positive — requirements.txt pins idna transitively via a floor that resolves to 3.18 in the lockfiles (requirements-core.lock, requirements-ci.lock). 3.18 > fix version 3.15. osv-scanner checks the lowest satisfiable version (3.9.0) instead of the actual resolved version."

[[IgnoredVulns]]
id = "GHSA-65pc-fj4g-8rjx"
reason = "False positive — alias of PYSEC-2026-215. Actual idna version is 3.18 (from lockfiles), above the fix version 3.15."

