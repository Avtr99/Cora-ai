# OSV-Scanner ignore list for requirements*.txt files in this directory.
#
# osv-scanner scans requirements.txt files that use bounded version ranges
# (e.g. >=3.29.4,<4.0) and checks the LOWEST satisfiable version for
# vulnerabilities, not the actual resolved version from the lockfiles.
# All ignores below are false positives — the actual pinned versions in the
# *.lock files are already above the fix versions.
#
# Verified against requirements-core.lock, requirements-ingestion.lock, and
# requirements-ci.lock (regenerated 2026-07-30 with uv pip compile --upgrade).
#
# Strategy: [[PackageOverrides]] with vulnerability.ignore = true for each
# package where the requirements.txt floor version differs from the lockfile
# version. This tells osv-scanner to skip vulnerability checks for these
# packages entirely, since the lockfiles (which have exact pins with hashes)
# are the source of truth for what's actually installed.

# --- False positives: packages where floor != actual lockfile version ---

[[PackageOverrides]]
name = "aiohttp"
ecosystem = "PyPI"
vulnerability.ignore = true
reason = "False positive — requirements.txt floor is 3.14.1, lockfile pins 3.14.3 (above fix versions). osv-scanner checks the floor, not the resolved version."

